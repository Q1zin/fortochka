name: Прод на связи

# Лёгкая проверка прода по расписанию: healthz и срок сертификата, данных
# не создаёт. Упавший прогон GitHub присылает письмом. В публичном репозитории
# расписание отключается после 60 дней без коммитов — тогда включить заново
# во вкладке Actions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  uptime:
    name: healthz и сертификат
    runs-on: ubuntu-latest
    steps:
      - name: Сервер отвечает
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors https://fortochka.fun/healthz
      # Caddy продлевает сертификат сам; если не смог (сломался DNS) — узнаем заранее
      - name: Сертификат действует ещё 14 дней
        run: |
          echo | openssl s_client -connect fortochka.fun:443 -servername fortochka.fun 2>/dev/null \
            | openssl x509 -noout -enddate -checkend $((14 * 24 * 3600))
